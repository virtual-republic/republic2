# Signed instruments are files until this runs. It verifies every signature,
# checks every balance, clears the auction, and records the result. A refusal is
# an outcome, not a failure — the instrument is set aside in refused/ with the
# reason beside it.
name: settle

on:
  push:
    branches: [main]
    paths: ['acts/**', 'contracts/**']
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency: { group: settle }

jobs:
  settle:
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --omit=dev || npm install --omit=dev

      - name: What is pending?
        run: node cli/republic.js settle --dry-run | tee "$RUNNER_TEMP/pending.txt"

      - name: Settle
        run: node cli/republic.js settle | tee "$RUNNER_TEMP/settle.txt"

      - name: The register must still verify
        run: node cli/republic.js verify

      - name: Record it
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          RECORDS="ledger acts settled refused register charters contracts"
          if [ -z "$(git status --porcelain -- $RECORDS)" ]; then echo "nothing settled"; exit 0; fi
          git config user.name  "Treasurer"
          git config user.email "treasurer@users.noreply.github.com"
          PRESENT=""
          for d in $RECORDS; do [ -e "$d" ] && PRESENT="$PRESENT $d"; done
          git add -A -- $PRESENT
          git commit -m "settle (art-10/§3/¶2, art-10/§5/¶2)" || { echo "nothing to record"; exit 0; }
          # close, settle and checkpoint all write to main and can race each
          # other. Rebase onto whatever landed first; the ledger is append-only,
          # so both sides are genuine records and doctor re-chains them.
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            git fetch origin main && git reset --soft origin/main
            git add ledger/ 2>/dev/null || true
            node cli/republic.js doctor --repair || true
            node cli/republic.js verify || exit 1
            git add -A && git commit -m "settle, re-chained after a concurrent record" || true
          fi

          if git push origin HEAD:main; then
            echo "recorded on main"
          else
            BR="settle/$(date -u +%Y-%m-%d-%H%M)"
            git branch "$BR" && git push -u origin "$BR"
            gh pr create --title "Settlement" --body-file "$RUNNER_TEMP/settle.txt" --base main \
              && gh pr merge "$BR" --squash --admin \
              || echo "::warning::Could not record automatically. Open https://github.com/$GITHUB_REPOSITORY/pull/new/$BR"
          fi

      - if: always()
        run: cat "$RUNNER_TEMP/settle.txt" >> $GITHUB_STEP_SUMMARY || true

# art-05/§1/¶2 — the site is a client of the repository, not the Republic.
name: publish

on:
  push:
    branches: [main]
  # A push made with GITHUB_TOKEN does not trigger another workflow — GitHub
  # blocks that to prevent recursion. So close and settle, which record results
  # by pushing to main, would never cause the site to rebuild. This listens for
  # them finishing instead.
  workflow_run:
    workflows: [close, settle, checkpoint]
    types: [completed]
  workflow_dispatch:

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --omit=dev || npm install --omit=dev
      - run: node cli/republic.js verify
      - run: node cli/republic.js build --base "${{ vars.BASE_PATH }}"
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4

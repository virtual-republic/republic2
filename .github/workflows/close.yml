# art-08/§3/¶5 — voting closes at the earlier of the end of the period, or the
# moment the outcome can no longer change.
# art-08/§5/¶1 — a measure that carries is enacted by publication.
#
# A measure that can no longer move is decided, so this records the result
# directly rather than waiting for anyone to merge it. Everything it writes is
# a record, and core/rules.js exempts records from the vote requirement
# precisely so that procedure can complete itself.
name: close

on:
  push:
    branches: [main]
    paths: ['ballots/**']
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      measure:
        description: 'Measure to close. Blank for everything due.'
        required: false

concurrency: { group: close }

jobs:
  close:
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --omit=dev || npm install --omit=dev

      - name: What is due?
        run: node cli/republic.js close ${{ inputs.measure }} --dry-run | tee "$RUNNER_TEMP/due.txt"

      - name: Close and enact
        run: node cli/republic.js close ${{ inputs.measure }} | tee "$RUNNER_TEMP/close.txt"

      - name: The register must still verify
        run: node cli/republic.js verify

      - name: Record it
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          RECORDS="ballots ledger journal register"
          if [ -z "$(git status --porcelain -- $RECORDS)" ]; then echo "nothing to record"; exit 0; fi
          git config user.name  "Keeper of the Journal"
          git config user.email "keeper@users.noreply.github.com"
          PRESENT=""
          for d in $RECORDS; do [ -e "$d" ] && PRESENT="$PRESENT $d"; done
          git add -A -- $PRESENT
          git commit -m "close and enact (art-08/§3/¶5, art-08/§5/¶1)" || { echo "nothing to record"; exit 0; }
          # art-08/§7 — no change reaches main except through a measure the gate has
          # judged. That applies to this workflow too. It opens a pull request and
          # asks for it to merge when the checks pass; the gate lets it through
          # because records are exempt by path, not because the workflow is
          # trusted.
          git fetch origin main
          git rebase origin/main || {
            git rebase --abort || true
            node cli/republic.js doctor --repair || true
            node cli/republic.js verify || exit 1
          }

          BR="close/$(date -u +%Y-%m-%d-%H%M%S)"
          git branch "$BR" && git push -u origin "$BR"
          gh pr create --title "Close and enact" --body-file "$RUNNER_TEMP/close.txt" --base main --head "$BR" \
            && gh pr merge "$BR" --squash --auto \
            || echo "::warning::Opened, but could not set it to merge automatically. Review and merge: https://github.com/$GITHUB_REPOSITORY/pulls"

      - if: always()
        run: cat "$RUNNER_TEMP/close.txt" >> $GITHUB_STEP_SUMMARY || true

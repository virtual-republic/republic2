# The Republic — every setting in one place.
#
# Nothing in core/ or cli/ hardcodes a value that appears here. A change to this
# file is an act of the Assembly like any other; core/rules.js says which class.

name: The Republic
motto: By record and by consent
founded: 2026-01-01

# What things are called here. The Constitution says "citizen" and "Assembly";
# a club says "member" and "the Fellowship"; a co-op says "member" and "the
# General Meeting". Changing these changes the words on the site and in the
# tools. It changes no rule — the provisions still say what they say, and a
# citation still resolves.
vocabulary:
  republic: Republic
  citizen: citizen
  citizens: citizens
  assembly: Assembly
  measure: measure
  measures: measures
  journal: Journal
  register: register
  court: Court
  office: office
  offices: offices
  entity: entity
  entities: entities
  deed: deed
  deeds: deeds

# Which parts of the Republic are in use. Turning one off hides it from the site
# and refuses its acts; it does not remove the law. A body that has no property
# to allocate should not be made to look at an exchange.
#
# art-01/§2/¶2 — authority is exercised only where it is conferred. Switching a
# subsystem off confers less, which a charter or a statute may always do.
using:
  assembly: true        # measures, voting, enactment
  court: true           # cases and judgments
  offices: true         # elected office with enumerated powers
  entities: true        # sub-organisations with their own charters
  value: true           # the unit, accounts, transfers
  instruments: true     # shares in an entity
  exchange: true        # trading those shares
  contracts: true       # agreements between parties
  deeds: true           # recognised title

# Where everything lives. Decided once, and never migrated.
paths:
  constitution: journal/constitution
  deeds: journal/deeds
  resolutions: resolutions
  statutes: journal/statutes
  judgments: journal/judgments
  issues: journal/issues
  citizens: register/citizens
  entities: register/entities
  offices: register/offices.yml
  keepers: register/keepers.txt
  ledger: ledger/events.jsonl
  proposals: proposals
  ballots: ballots
  acts: acts
  settled: settled
  refused: refused
  checkpoints: checkpoints
  charters: charters
  contracts: contracts
  private: private
  dist: dist

# Classes of measure. Quorum is a fraction of active citizenships; threshold a
# fraction of decisive votes. art-08.
classes:
  policy:     { label: Policy,                    quorum: 0.20, threshold: 0.50,   window: 7 }
  ordinary:   { label: Ordinary measure,          quorum: 0.20, threshold: 0.50,   window: 7 }
  organic:    { label: Organic statute,           quorum: 0.33, threshold: 0.6667, window: 14 }
  amendment:  { label: Constitutional amendment,  quorum: 0.50, threshold: 0.6667, window: 21, readings: 2, apart: 30 }
  entrenched: { label: Entrenched provision,      quorum: 0.60, threshold: 0.75,   window: 30, readings: 2, apart: 30 }
  election:   { label: Election,                  quorum: 0.33, method: irv,       window: 7 }

ballot:
  one_per_citizenship: true
  allow_update: true
  # art-08 — voting closes when waiting can no longer change the outcome.
  close_early:
    on_full_participation: true
    on_determined_outcome: true
    minimum_participation: 1.0

offices:
  registrar:  { title: Registrar,             powers: [citizen.admit, citizen.object, entity.register] }
  keeper:     { title: Keeper of the Journal, powers: [journal.publish, checkpoint.sign, code.approve, deed.recognise] }
  treasurer:  { title: Treasurer,             powers: [value.issue, treasury.disburse] }
  auditor:    { title: Auditor,               powers: [audit.report] }
  judge:      { title: Judge of the Court,    powers: [court.halt, court.void, court.judge] }
  term: 365

# What each type may do, and how it decides by default. A charter may narrow
# these but never widen them — art-04/§3/¶3.
#
#   vote: members  one member, one vote, however much they hold
#   vote: shares   weighted by the instruments held
#   listed         whether its instruments may be traded on the exchange
entities:
  association:
    label: Association
    formed_by: citizen
    account: true
    instruments: false
    governance: { vote: members, quorum: 0.50, threshold: 0.50, term: 365 }
  company:
    label: Company
    formed_by: citizen
    account: true
    instruments: true
    listed_by_default: false
    governance: { vote: shares, quorum: 0.50, threshold: 0.50, term: 365 }
  foundation:
    label: Foundation
    formed_by: citizen
    account: true
    instruments: false
    governance: { vote: members, quorum: 0.50, threshold: 0.6667, term: 730 }
  commune:
    label: Commune
    formed_by: law
    account: true
    instruments: false
    entered_by: registrar
    governance: { vote: members, quorum: 0.33, threshold: 0.50, term: 365 }
  organ:
    label: Organ of the Republic
    formed_by: law
    account: true
    instruments: false
    entered_by: registrar
    governance: { vote: members, quorum: 0.50, threshold: 0.50, term: 365 }

# A resolution of an entity's members. The same shape as a measure of the
# Assembly, decided by the entity's own charter.
resolutions:
  window: 7
  close_early: { on_full_participation: true }
  kinds: [policy, officer, charter]

value:
  unit: obol
  subunit: mina
  issue_cap: 100000

  # art-10/§5/¶2 — the method is fixed by statute, and these are the settings it
  # reads. price_time: best price first, and among equal prices the order that
  # arrived first. A trade happens at the RESTING order's price, so the one who
  # waited sets the terms.
  exchange:
    method: price_time
    trade_at: resting
    # An order partly filled is not left half-alive. The remainder is cancelled,
    # so nobody is left holding a position they did not choose to keep.
    partial_fill_cancels_remainder: true

contracts:
  all_parties_must_sign: true
  expiry: 30

# A deed is recognised title. It is valid only when the Keeper has recognised it
# and it has been published in the Journal — recognition and publication are one
# act, so neither can happen without the other.
deeds:
  recognised_by: deed.recognise      # the power, not the person
  transferable_by_default: false
  kinds: [property, claim, right, licence, membership]

journal:
  publish_on_enactment: true
